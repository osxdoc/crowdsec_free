<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
  <title>CrowdSec · self-hosted console</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232f6feb'%3E%3Cpath d='M12 2 4 6v6c0 5 3.4 9.3 8 10 4.6-.7 8-5 8-10V6l-8-4Z'/%3E%3C/svg%3E">
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2.8 4.6 6.2v5.6c0 4.7 3.1 8.7 7.4 9.4 4.3-.7 7.4-4.7 7.4-9.4V6.2L12 2.8Z"/></symbol>
    <symbol id="i-dashboard" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/></symbol>
    <symbol id="i-alerts" viewBox="0 0 24 24"><path d="M18 8.5a6 6 0 1 0-12 0c0 5.2-2 6.5-2 6.5h16s-2-1.3-2-6.5Z"/><path d="M13.7 19.5a2 2 0 0 1-3.4 0"/></symbol>
    <symbol id="i-decisions" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M5.6 5.6 18.4 18.4"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.4 3.6 5.3 3.6 8.5S14.4 18.1 12 20.5c-2.4-2.4-3.6-5.3-3.6-8.5S9.6 5.9 12 3.5Z"/></symbol>
    <symbol id="i-blocklist" viewBox="0 0 24 24"><path d="m12 3.5 8.5 4.7L12 12.9 3.5 8.2 12 3.5Z"/><path d="m3.5 12.9 8.5 4.7 8.5-4.7"/><path d="m3.5 17.3 8.5 4.7 8.5-4.7" opacity=".5"/></symbol>
    <symbol id="i-hub" viewBox="0 0 24 24"><path d="M20.5 8.2v7.6L12 20.5l-8.5-4.7V8.2L12 3.5l8.5 4.7Z"/><path d="M3.8 8.4 12 13l8.2-4.6M12 13v7.3"/></symbol>
    <symbol id="i-allowlist" viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h6"/><path d="m3 6 1.6 1.6L7.4 4.8M3 17l1.6 1.6L7.4 15.8"/></symbol>
    <symbol id="i-config" viewBox="0 0 24 24"><path d="M4 7h9M18 7h2M4 17h5M14 17h6"/><circle cx="15.5" cy="7" r="2.4"/><circle cx="11.5" cy="17" r="2.4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m15.8 15.8 4.4 4.4"/></symbol>
    <symbol id="i-server" viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="6.5" rx="2"/><rect x="3.5" y="13.5" width="17" height="6.5" rx="2"/><path d="M7 7.2h.01M7 16.8h.01"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3.5 12h4l2.5-6 4 12 2.5-6h4"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M15 4.5h3.5A1.5 1.5 0 0 1 20 6v12a1.5 1.5 0 0 1-1.5 1.5H15"/><path d="M10 8.5 6.5 12l3.5 3.5M6.5 12H15"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V5.2c0-.4.3-.7.7-.7h3.6c.4 0 .7.3.7.7V7M6.5 7l.8 12.1c0 .5.4.9.9.9h7.6c.5 0 .9-.4.9-.9L17.5 7"/></symbol>
  </svg>

  <div id="login" class="login hidden">
    <div class="login-glow" aria-hidden="true"></div>
    <form class="login-card" id="login-form">
      <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><use href="#i-shield"/></svg></div>
      <h1>Self-hosted console</h1>
      <p class="subtitle">No cloud account, no subscription. Your engine, your data.</p>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn primary block" type="submit" id="login-submit">Sign in</button>
      <p class="login-error" id="login-error" role="alert"></p>
    </form>
  </div>

  <div id="app" class="app hidden">
    <a class="skip-link" href="#view">Skip to content</a>

    <div class="nav-scrim" id="nav-scrim" hidden></div>

    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><use href="#i-shield"/></svg></span>
        <span class="brand-text">
          <strong>CrowdSec</strong>
          <small>Self-hosted</small>
        </span>
      </div>

      <nav class="nav" id="nav" aria-label="Main navigation">
        <span class="nav-group">Monitor</span>
        <a href="#/dashboard" data-route="dashboard"><svg viewBox="0 0 24 24"><use href="#i-dashboard"/></svg><span>Dashboard</span></a>
        <a href="#/alerts" data-route="alerts"><svg viewBox="0 0 24 24"><use href="#i-alerts"/></svg><span>Alerts</span></a>
        <a href="#/decisions" data-route="decisions"><svg viewBox="0 0 24 24"><use href="#i-decisions"/></svg><span>Decisions</span></a>
        <a href="#/geo" data-route="geo"><svg viewBox="0 0 24 24"><use href="#i-globe"/></svg><span>Geo</span></a>

        <span class="nav-group">Manage</span>
        <a href="#/blocklist" data-route="blocklist" id="nav-blocklist"><svg viewBox="0 0 24 24"><use href="#i-blocklist"/></svg><span>Blocklist</span></a>
        <a href="#/hub" data-route="hub"><svg viewBox="0 0 24 24"><use href="#i-hub"/></svg><span>Hub</span></a>
        <a href="#/allowlists" data-route="allowlists"><svg viewBox="0 0 24 24"><use href="#i-allowlist"/></svg><span>Allowlists</span></a>
        <a href="#/config" data-route="config"><svg viewBox="0 0 24 24"><use href="#i-config"/></svg><span>Configuration</span></a>

        <span class="nav-group">Tools</span>
        <a href="#/inspect" data-route="inspect"><svg viewBox="0 0 24 24"><use href="#i-search"/></svg><span>IP lookup</span></a>
        <a href="#/infrastructure" data-route="infrastructure"><svg viewBox="0 0 24 24"><use href="#i-server"/></svg><span>Infrastructure</span></a>
        <a href="#/metrics" data-route="metrics"><svg viewBox="0 0 24 24"><use href="#i-activity"/></svg><span>Metrics</span></a>
      </nav>

      <div class="sidebar-footer">
        <div class="account">
          <span class="avatar" id="user-avatar" aria-hidden="true">—</span>
          <span class="account-text">
            <strong id="current-user">—</strong>
            <small id="version">cswebui</small>
          </span>
        </div>
        <div class="account-actions">
          <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch theme">
            <svg viewBox="0 0 24 24"><use href="#i-moon"/></svg>
          </button>
          <button class="icon-btn" id="logout" type="button" aria-label="Sign out" title="Sign out">
            <svg viewBox="0 0 24 24"><use href="#i-logout"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="mobile-bar">
        <button class="icon-btn nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav" aria-label="Open navigation">
          <svg viewBox="0 0 24 24"><use href="#i-menu"/></svg>
        </button>
        <span class="mobile-title" id="mobile-title">Dashboard</span>
      </header>
      <div class="content" id="view" tabindex="-1"></div>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite" aria-relevant="additions"></div>
  <div id="modal-root"></div>

  <script src="/worldmap.js"></script>
  <script src="/operations.js"></script>
  <script src="/app.js"></script>
</body>
</html>
