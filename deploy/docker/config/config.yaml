# CrowdSec Security Engine - container configuration.
# Paths are container paths; edit deploy/docker/config/*.yaml, not the image.
common:
  daemonize: false
  log_media: stdout
  log_level: info

config_paths:
  config_dir: /etc/crowdsec/
  data_dir: /var/lib/crowdsec/data/
  simulation_path: /etc/crowdsec/simulation.yaml
  hub_dir: /etc/crowdsec/hub/
  index_path: /etc/crowdsec/hub/.index.json
  notification_dir: /etc/crowdsec/notifications/
  plugin_dir: /usr/local/lib/crowdsec/plugins/

crowdsec_service:
  acquisition_path: /etc/crowdsec/acquis.yaml
  acquisition_dir: /etc/crowdsec/acquis.d
  parser_routines: 1

cscli:
  output: human
  color: auto

db_config:
  type: sqlite
  use_wal: true
  db_path: /var/lib/crowdsec/data/crowdsec.db
  flush:
    max_items: 5000
    max_age: 7d

api:
  client:
    insecure_skip_verify: false
    credentials_path: /etc/crowdsec/local_api_credentials.yaml
  server:
    log_level: info
    # Reachable from the other containers (cswebui, bouncers on the compose network).
    listen_uri: 0.0.0.0:8080
    profiles_path: /etc/crowdsec/profiles.yaml
    console_path: /etc/crowdsec/console.yaml
    online_client:
      credentials_path: /etc/crowdsec/online_api_credentials.yaml
    # The UI container deletes alerts/decisions through the admin API, which
    # requires a trusted source address. Keep this in sync with the compose
    # subnet (CROWDSEC_SUBNET).
    trusted_ips:
      - 127.0.0.1
      - ::1
      - 172.28.0.0/16

prometheus:
  enabled: true
  level: full
  # Scraped by cswebui over the compose network, never published.
  listen_addr: 0.0.0.0
  listen_port: 6060
