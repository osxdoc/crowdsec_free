name: crowdsec-free

# Every service runs the same image: engine, cscli, cswebui and csblocklistd.
# A deployment normally keeps its own copy of this file next to its ./config
# and ./data. Only the build source (the context, or the whole "build:" block
# when the image is built with build-image.sh) and the log mounts should differ;
# every other knob is a variable below, so the copies stay comparable.
x-app: &app
  image: crowdsec-free:${CROWDSEC_VERSION:-v1.8.2}
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile
    args:
      VERSION: ${CROWDSEC_VERSION:-v1.8.2}

x-volumes: &volumes
  - ./config:/etc/crowdsec
  - ./data:/var/lib/crowdsec/data

services:
  # One-shot: writes the default config, generates the admin password and the
  # blocklist token, registers the agent + UI machines, installs hub
  # collections and GeoIP data. Must run before csblocklistd so that the
  # blocklist server picks up the final admin token.
  bootstrap:
    <<: *app
    command: ["/usr/local/bin/bootstrap.sh", "config"]
    restart: "no"
    environment:
      HUB_COLLECTIONS: ${HUB_COLLECTIONS:-crowdsecurity/linux}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:-}
      BLOCKLIST_ADMIN_TOKEN: ${BLOCKLIST_ADMIN_TOKEN:-}
      SKIP_HUB_UPDATE: ${SKIP_HUB_UPDATE:-false}
      TZ: ${TZ:-Etc/UTC}
    volumes: *volumes

  # Self-hosted CAPI: engines register here, push manual decisions and pull the
  # shared blocklist.
  csblocklistd:
    <<: *app
    command: ["csblocklistd", "-config", "/etc/crowdsec/blocklist.yaml"]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
    volumes: *volumes
    ports:
      - "${BLOCKLIST_BIND:-127.0.0.1}:${BLOCKLIST_PORT:-8082}:8082"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  # One-shot: subscribes the engine to the blocklist server (needs it healthy).
  register:
    <<: *app
    command: ["/usr/local/bin/bootstrap.sh", "register"]
    restart: "no"
    environment:
      BLOCKLIST_TIMEOUT: "120"
      TZ: ${TZ:-Etc/UTC}
    volumes: *volumes
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      csblocklistd:
        condition: service_healthy

  crowdsec:
    <<: *app
    # A fixed name keeps "docker exec crowdsec cscli ..." working across stacks.
    container_name: ${ENGINE_CONTAINER_NAME:-crowdsec}
    command: ["crowdsec", "-c", "/etc/crowdsec/config.yaml"]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ./config:/etc/crowdsec
      - ./data:/var/lib/crowdsec/data
      # Read-only access to the host logs configured in acquis.yaml.
      - /var/log:/host/var/log:ro
    ports:
      # Bouncers on the same host (or in the host network) reach the LAPI and
      # appsec over localhost. Set the *_BIND variables to 0.0.0.0 for bouncers
      # on other hosts, and keep api.server.trusted_ips narrow.
      - "${LAPI_BIND:-127.0.0.1}:${LAPI_PORT:-8080}:8080"
      - "${APPSEC_BIND:-127.0.0.1}:${APPSEC_PORT:-7422}:7422"
    depends_on:
      register:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s

  # Web UI: dashboard, decisions, hub management, config editing and the shared
  # blocklist view.
  cswebui:
    <<: *app
    command: ["cswebui", "-config", "/etc/crowdsec/webui.yaml"]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
    # Shares the engine's PID namespace so hub changes and "Reload engine" can
    # send SIGHUP.
    pid: "service:crowdsec"
    volumes: *volumes
    ports:
      # Bound to localhost: put a TLS reverse proxy in front of it, or set
      # WEBUI_BIND=0.0.0.0 if you accept plain HTTP on your network.
      - "${WEBUI_BIND:-127.0.0.1}:${WEBUI_PORT:-8081}:8081"
    depends_on:
      crowdsec:
        condition: service_healthy

networks:
  default:
    ipam:
      config:
        # Must match api.server.trusted_ips in config.yaml.
        - subnet: ${CROWDSEC_SUBNET:-172.28.0.0/16}
