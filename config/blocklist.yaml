# csblocklistd - self-hosted replacement for the CrowdSec Central API (CAPI).
#
# Engines register with:
#   cscli capi register --url http://<this-host>:8082/ -f /etc/crowdsec/online_api_credentials.yaml
#
# and then push their shared signals and pull the aggregated decision stream,
# without any crowdsec.net account.

listen: 127.0.0.1:8082
db_path: /var/lib/crowdsec/blocklist.db

# Protects /admin/v1 (used by cswebui). Generate with:
#   csblocklistd -gen-admin-token
admin_token: ""

# Optional: require a token for new watcher registrations. Note that
# `cscli capi register` cannot send one; leave empty and restrict network
# access instead.
registration_token: ""

# Scenario name under which entries are served to engines. Keeping the CAPI
# name makes pulled entries look like the usual community blocklist.
community_scenario: crowdsec/community-blocklist

# JWT lifetime handed out at login.
token_ttl: 24h

# HTTPS (optional; a reverse proxy works too).
# tls_cert: /etc/crowdsec/tls/blocklist.crt
# tls_key: /etc/crowdsec/tls/blocklist.key

push:
  # Decision origins accepted from engines. "cscli" means manual bans only,
  # which is usually what you want to share. Add "crowdsec" to also share
  # decisions generated by scenarios (noisy and often instance-specific).
  accept_origins: ["cscli"]
  max_alerts_per_request: 100
  max_decisions_per_alert: 1000
  # Used when a pushed decision has no duration.
  default_duration: 4h
